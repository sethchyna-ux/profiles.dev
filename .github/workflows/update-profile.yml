name: Update profiles.dev

on:
  push:
    branches: [main]
    paths:
      - profile.yaml

permissions:
  id-token: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: action/package-lock.json

      - name: Build local profiles.dev action
        working-directory: action
        run: |
          npm ci
          npm run build

      - name: Update profiles.dev
        uses: ./action
