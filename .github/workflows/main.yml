name: Update profiles.dev

on:
  push:
    branches: [ main ]  # or 'master' if that's your default
    paths:
      - 'profile.yaml'
  # NOTE: workflow_dispatch is NOT supported

permissions:
  id-token: write
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nomadops/profiles.dev@v2
